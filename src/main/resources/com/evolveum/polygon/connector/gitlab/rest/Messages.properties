authentication.display=Authentication
authentication.help=Please provide the type of authentication
privateToken.display=Private Token
privateToken.help=Please provide the token for a token type of authentication
username.display=Username
username.help=Please provide the administrator user name for the scim enabled service you are logging into
password.display=Password
password.help=Please provide the administrator password used to connect to the scim enabled service

loginUrl.display=Gitlab endpoint
loginUrl.help=Please provide the Url address for log in
protocol.display=Protocol
protocol.help=Please provide the protocol of connection https or http(deffaut)
groupsToManage.display=Group filter
groupsToManage.help=List of groups to manage user membership in these groups (delimiter ","). Scope - Account ObjectClass. Empty value means all groups.
objectAvatar.display=Object Avatar select
objectAvatar.help=Choose between true or false for reading the avatar URL. If any group or project has an avatar, select false.

# HTTP Proxy
httpProxyHost.display=HTTP Proxy Host
httpProxyHost.help=The hostname or IP address of the HTTP proxy server
httpProxyPort.display=HTTP Proxy Port
httpProxyPort.help=The port number of the HTTP proxy server
httpProxyUser.display=HTTP Proxy Username
httpProxyUser.help=The username for authenticating with the HTTP proxy server
httpProxyPassword.display=HTTP Proxy Password
httpProxyPassword.help=The password for authenticating with the HTTP proxy server

# HTTP Connection timeout
httpConnectTimeout.display=HTTP Connect Timeout (ms)
httpConnectTimeout.help=The timeout in milliseconds for establishing a connection (default: 10000)
httpSocketTimeout.display=HTTP Socket Timeout (ms)
httpSocketTimeout.help=The timeout in milliseconds for waiting for data (read timeout, default: 10000)
httpConnectionRequestTimeout.display=HTTP Connection Request Timeout (ms)
httpConnectionRequestTimeout.help=The timeout in milliseconds for requesting a connection from the connection manager (default: 10000)

# Default access level
defaultAccessLevel.display=Default Access Level
defaultAccessLevel.help=Default access level for group and project memberships when not explicitly specified. Must be a positive integer. Common GitLab values: 10=Guest, 20=Reporter, 30=Developer, 40=Maintainer, 50=Owner (default: 10)

# Membership format control
includeMembershipAccessLevel.display=Include Access Level in Groups/Projects Attributes
includeMembershipAccessLevel.help=Controls format of consolidated membership attributes (groups, projects) in executeQuery. When true, uses "id#accessLevel" format (e.g., "123#10"). When false, uses only "id" format (e.g., "123"). Does not affect groups_as_* or projects_as_* attributes. Default: false